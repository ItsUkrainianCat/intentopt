name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check tools
        run: |
          python -m pip install uv==0.12.22
          npm install --global pyright@1.1.414
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Format and lint
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
      - name: Type check
        run: pyright --pythonpath "$(uv run --frozen python -c 'import sys; print(sys.executable)')"
      - name: Offline tests
        run: uv run --frozen pytest
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history without exposing matches
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact
