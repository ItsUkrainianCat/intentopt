[project]
name = "autoimprover"
version = "0.2.0.dev0"
description = "Prompt optimizer: GEPA search over a prompt, scored on the user's own examples"
requires-python = ">=3.12"
dependencies = [
    "gepa==0.1.4",
]

[project.scripts]
autoimprover = "autoimprover.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

# Exact pins: a check must give the same answer on every machine and in every worktree.
[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: two test files may share a name (tests/test_cli.py and tests/acceptance/test_cli.py);
# `pythonpath` lets tests import the shared doubles as `from fakes import ...`.
addopts = "-q --import-mode=importlib -p pytester"
pythonpath = ["tests"]
markers = ["real_process: the test may start a child process (see tests/conftest.py)"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
