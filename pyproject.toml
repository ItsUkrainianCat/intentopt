[project]
name = "autoimprover"
version = "0.1.0"
description = "SOTA autonomous prompt optimizer for Claude Code using DSPy + GEPA"
requires-python = ">=3.11"
dependencies = [
    "dspy>=3.1",
    "gepa @ git+https://github.com/gepa-ai/gepa.git",
    "anthropic",
    "litellm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
